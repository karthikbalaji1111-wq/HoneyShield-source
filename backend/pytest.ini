[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    postgres: requires a real PostgreSQL server (HS_TEST_PG_ADMIN_URL)
    s3: requires a real S3 Object Lock store (HS_TEST_S3_ENDPOINT)
    redis: requires a real Redis server (HS_TEST_REDIS_URL)
asyncio_default_fixture_loop_scope = function
