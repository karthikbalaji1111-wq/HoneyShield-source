# Shared upstream headers. X-Forwarded-For is overwritten (not appended) so a client cannot
# inject earlier hops; the backend trusts it only from this proxy's fixed address.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-ID      $request_id;
# The edge is the only source of HSTS (the backend may add it too), so it is never sent twice.
proxy_hide_header Strict-Transport-Security;
