name: CodeQL

# GitHub's semantic code analysis for security bugs (injection, path traversal, unsafe
# deserialisation, missing escaping and similar) in the Python backend, the console's JavaScript and
# the workflows themselves. Results appear under the repository's Security tab, Code scanning, for
# anyone to see. Code scanning is free for public repositories, so this runs in the public
# HoneyShield-source; a private repository would need GitHub Advanced Security.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly, so new CodeQL queries also check unchanged code

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    if: github.repository == 'karthikbalaji1111-wq/HoneyShield-source'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: /language:${{ matrix.language }}
